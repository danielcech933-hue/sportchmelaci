name: fix-dm-history

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch latest DM window
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/lib/dm.tsx')
          text = p.read_text(encoding='utf-8')

          old = '''  const load = useCallback(async () => {
    if (!user) {
      setMessages([]);
      return;
    }
    const { data } = await supabase
      .from("direct_messages")
      .select("id,sender_id,recipient_id,content,read_at,created_at")
      .order("created_at", { ascending: true })
      .limit(500);
    setMessages(((data ?? []) as Row[]).map(toDm));
  }, [user]);'''

          new = '''  const load = useCallback(async () => {
    if (!user) {
      setMessages([]);
      return;
    }

    const { data, error } = await supabase
      .from("direct_messages")
      .select("id,sender_id,recipient_id,content,read_at,created_at")
      .or(`sender_id.eq.${user.id},recipient_id.eq.${user.id}`)
      .order("created_at", { ascending: false })
      .limit(500);

    if (error) return;

    const rows = ((data ?? []) as Row[]).reverse();
    if (rows.length === 0) {
      setMessages([]);
      return;
    }

    setMessages((prev) => {
      const merged = new Map(prev.map((m) => [m.id, m]));
      for (const row of rows) merged.set(row.id, toDm(row));
      return [...merged.values()].sort((a, b) => {
        if (a.createdAt === b.createdAt) return a.id.localeCompare(b.id);
        return a.createdAt < b.createdAt ? -1 : 1;
      });
    });
  }, [user]);'''

          if old not in text:
              print('DM load already patched; nothing to do')
              raise SystemExit(0)

          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('patched DM load')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/dm.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(chat): show latest DM messages and preserve history"
          git push origin HEAD:main

      - name: Remove one-time workflow after patch
        if: ${{ success() }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/fix-dm-history.yml')
          if p.exists(): p.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/fix-dm-history.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: remove one-time DM history workflow"
          git push origin HEAD:main
