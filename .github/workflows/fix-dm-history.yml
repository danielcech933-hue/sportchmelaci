name: fix-dm-history

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch DM history loading
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('src/lib/dm.tsx')
          text = p.read_text(encoding='utf-8')

          pattern = re.compile(r'''  const load = useCallback\(async \(\) => \{\n.*?\n  \}, \[user\]\);''', re.S)
          replacement = '''  const load = useCallback(async () => {
    if (!user) {
      setMessages([]);
      return;
    }

    const { data, error } = await supabase
      .from("direct_messages")
      .select("id,sender_id,recipient_id,content,read_at,created_at")
      .or(`sender_id.eq.${user.id},recipient_id.eq.${user.id}`)
      .order("created_at", { ascending: false })
      .limit(500);

    // Never clear working state on a transient read error.
    if (error) return;

    const rows = ((data ?? []) as Row[]).reverse();

    // Empty data is a confirmed empty result. Otherwise merge the latest server
    // window with the existing client state so older messages are not discarded.
    if (rows.length === 0) {
      setMessages([]);
      return;
    }

    setMessages((prev) => {
      const merged = new Map(prev.map((m) => [m.id, m]));
      for (const row of rows) merged.set(row.id, toDm(row));
      return [...merged.values()].sort((a, b) => {
        if (a.createdAt === b.createdAt) return a.id.localeCompare(b.id);
        return a.createdAt < b.createdAt ? -1 : 1;
      });
    });
  }, [user]);'''

          new_text, count = pattern.subn(lambda _: replacement, text, count=1)
          if count != 1:
              raise SystemExit('expected DM load function not found; refusing unsafe patch')

          text = new_text
          p.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/dm.tsx
          git commit -m "fix(chat): keep latest DM window and merge state"
          git push origin HEAD:main

          rm -f .github/workflows/fix-dm-history.yml
          git add .github/workflows/fix-dm-history.yml
          git commit -m "chore: remove one-time DM history patch"
          git push origin HEAD:main
