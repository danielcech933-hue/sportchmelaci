name: Masterpiece UI refactor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2
      - run: bun install --no-frozen-lockfile
      - name: Refactor homepage presentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text(encoding='utf-8')

          # Imports and page-level class.
          s = s.replace('import { SportActionModal } from "@/components/SportActionModal";\n', 'import { SportActionModal } from "@/components/SportActionModal";\nimport { SocialHub } from "@/components/SocialHub";\n')
          s = s.replace('className="relative z-10 mx-auto max-w-[1500px]', 'className="chm-home relative z-10 mx-auto max-w-[1540px]', 1)

          # Remove fake/personalised event copy and keep the hero brand-led.
          s = s.replace('ZÁPAS<br /><span className="gold-text">STOLETÍ</span>', 'DNES<br /><span className="gold-text">SE HRAJE</span>', 1)
          s = s.replace('Daniel Čech · The Main Event · Clay Court · 2026', 'HLAVNÍ SPORTOVNÍ DĚNÍ · ZÁPASY · KOMUNITA · TURNAJE', 1)
          s = s.replace('SPORTCHMELÁCI PRESENTS', 'CHMELOVÍ SPORTOVCI', 1)
          s = s.replace('FEATURED</span>', 'HLAVNÍ EVENT</span>', 1)
          s = s.replace('MATCHDAY 01', 'DNES', 1)
          s = s.replace('ZÁPAS DNEŠKA', 'UDÁLOST DNE', 1)
          s = s.replace('Sledovat Matchday', 'Otevřít živé dění', 1)
          s = s.replace('Program</Link>', 'Program</Link>', 1)

          # Remove decorative fake social actions from hero; keep the main content clean.
          start = s.find('          <div className="flex items-center justify-between gap-4 border-t border-white/8 bg-black/25 px-4 py-3 sm:px-6">')
          if start != -1:
              end = s.find('          </div>\n          <div className="px-4 pb-4 pt-1 sm:px-6 sm:pb-5">', start)
              if end == -1:
                  raise SystemExit('hero social toolbar boundary not found')
              replacement = '''          <div className="border-t border-white/8 bg-black/20 px-4 py-3 sm:px-6">\n            <div className="flex items-center justify-between gap-3">\n              <div className="min-w-0">\n                <div className="font-display text-sm tracking-[.08em] text-white">SPORTOVNÍ CENTRUM CHMELOVÝCH SPORTOVCŮ</div>\n                <div className="aaa-meta mt-1">ŽIVÉ ZÁPASY · VÝSLEDKY · SPORTY · KOMUNITA</div>\n              </div>\n              <Link to="/community" className="hidden shrink-0 font-mono text-[8px] font-black uppercase tracking-[.18em] text-cyan-200/70 transition hover:text-cyan-100 sm:block">Komunita →</Link>\n            </div>\n          </div>\n'''
              s = s[:start] + replacement + s[end + len('          </div>\n'):]

          # Localize the remaining dashboard copy on home.
          replacements = {
              'PERSONAL SIGNAL':'TVŮJ PŘEHLED', 'GUEST':'HOST', 'ACTIVE PLAYER':'AKTIVNÍ HRÁČ', 'PUBLIC LOBBY':'VEŘEJNÁ LOBBY',
              'SPORT DOLLARS':'SPORTOVNÍ DOLARY', 'SLOT CZK':'HERNÍ KREDIT', 'LIVE NOW':'ŽIVĚ', 'NEXT MATCHES':'DALŠÍ ZÁPASY',
              'SPORT HUB':'SPORTY', 'COMMUNITY':'KOMUNITA', 'MATCH CONTROL':'ZÁPASY', 'LIVE & NEXT':'ŽIVĚ A DALŠÍ',
              'PLAYER ROUTES':'RYCHLÉ AKCE', 'QUICK ACTIONS':'RYCHLÉ AKCE', 'HOME':'DOMA', 'AWAY':'HOSTÉ',
              'LIVE MATCH':'ŽIVÝ ZÁPAS', 'FEATURED MATCH':'HLAVNÍ ZÁPAS', '2V2 TEAM MATCH':'TÝMOVÝ ZÁPAS 2V2',
              '1V1 MATCH':'ZÁPAS 1V1', 'COMPETITIVE PULSE':'SOUTĚŽNÍ VLNA', 'BUILD YOUR NEXT RUN':'VYBER SI DALŠÍ VÝZVU',
              'Scoreboard':'Žebříček', 'Community':'Komunita', 'SPORT MATRIX':'SPORTOVNÍ PŘEHLED', 'Full Hub':'Celý sportovní přehled',
              'SPORT':'SPORT', 'ESPORT':'ESPORT', '1V1 · 2V2':'1V1 · 2V2', 'Team HQ':'Týmové centrum', 'Trophy Room':'Síň trofejí',
              'Casino':'Hry', 'Betting Desk':'Sázkový přehled', 'Markets · odds · risk':'Kurzy · trhy · přehled',
              'Achievements · prestige':'Úspěchy · prestiž', 'Slots · roulette · play money':'Hry · bonusy · zábava', 'Roster · 2v2 · squads':'Soupiska · 2v2 · týmy',
              'LIVE SYNC':'ŽIVÁ DATA', 'SERVER AUTH':'SERVEROVÉ OVLÁDÁNÍ', '2V2 READY':'2V2 PŘIPRAVENO', 'AAA UI':'PRÉMIOVÉ UI',
              'Fixtures obnovovány průběžně':'Zápasy se průběžně aktualizují', 'Důležité herní akce validuje server':'Důležité akce ověřuje server',
              'Týmové zápasy jsou první třída':'Týmové zápasy jsou plně podporované', 'Mac · Windows · iPhone · Android':'Počítač · iPhone · Android',
          }
          for a,b in replacements.items():
              s = s.replace(a,b)

          # Insert real community/social layer before sport matrix.
          anchor = '      <section className="mt-5 aaa-card p-4 sm:p-5">'
          social = '''      <section className="chm-home-social mt-6">\n        <div className="mb-3 flex items-end justify-between gap-3">\n          <div>\n            <div className="aaa-meta text-cyan-200/70">KOMUNITA</div>\n            <h2 className="mt-1 font-display text-3xl tracking-[.11em] text-white">PŘÍBĚHY & FEED</h2>\n          </div>\n          <Link to="/community" className="aaa-ghost shrink-0 px-3 py-2 text-[8px] font-black uppercase tracking-[.16em]">Otevřít komunitu <ArrowRight className="h-3.5 w-3.5" /></Link>\n        </div>\n        <SocialHub compact />\n      </section>\n\n'''
          if 'className="chm-home-social mt-6"' not in s:
              if anchor not in s:
                  raise SystemExit('sport matrix anchor not found')
              s = s.replace(anchor, social + anchor, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Add masterpiece visual layer
        run: |
          cat >> src/chmel-design-system.css <<'CSS'

/* CHMEL SPORT OS — MASTERPIECE LAYER 01 */
.chm-app-shell .chm-home{padding-top:1.1rem!important;isolation:isolate}
.chm-app-shell .chm-home::before{content:"";position:absolute;inset:0 0 auto 0;height:520px;z-index:-1;pointer-events:none;background:radial-gradient(circle at 64% 18%,rgba(225,184,77,.11),transparent 28%),radial-gradient(circle at 18% 22%,rgba(37,216,234,.07),transparent 24%),linear-gradient(180deg,rgba(8,12,17,.25),transparent)}
.chm-app-shell .chm-home>section{margin-top:1.1rem}
.chm-app-shell .chm-home>section:first-child{margin-top:.15rem}
.chm-app-shell .chm-home>section:first-child>article{border-radius:26px!important;border-color:rgba(225,184,77,.22)!important;box-shadow:0 34px 120px -72px rgba(225,184,77,.34),0 28px 100px -55px rgba(0,0,0,.9)!important}
.chm-app-shell .chm-home>section:first-child>aside{border-radius:26px!important;min-height:100%;box-shadow:0 30px 90px -62px rgba(0,0,0,.96)!important}
.chm-app-shell .chm-home>section:first-child article img{filter:saturate(.9) contrast(1.05);transform:scale(1.015)}
.chm-app-shell .chm-home h1{font-size:clamp(3.8rem,8vw,7.3rem)!important;line-height:.82!important;letter-spacing:.055em!important}
.chm-app-shell .chm-home .aaa-meta{letter-spacing:.22em}
.chm-app-shell .chm-home [class*="grid-cols-4"]>div{min-height:92px;display:flex;flex-direction:column;justify-content:center}
.chm-app-shell .chm-home .chm-home-social{position:relative}
.chm-app-shell .chm-home .chm-home-social::before{content:"";display:block;height:1px;margin:0 12% 1.1rem;background:linear-gradient(90deg,transparent,rgba(37,216,234,.32),rgba(225,184,77,.55),transparent)}
.chm-app-shell .chm-home .chm-home-social>section{border-radius:24px!important;border-color:rgba(37,216,234,.11)!important;background:linear-gradient(145deg,rgba(15,24,31,.82),rgba(8,12,17,.94))!important;box-shadow:0 30px 100px -70px rgba(37,216,234,.18)!important}
.chm-app-shell .chm-home .match-row{min-height:66px}
.chm-app-shell .chm-home a[class*="aaa-ghost"],.chm-app-shell .chm-home a[class*="aaa-cta"]{letter-spacing:.14em}
.chm-app-shell .chm-home .aaa-cta{box-shadow:0 24px 70px -38px rgba(225,184,77,.72),inset 0 1px 0 rgba(255,255,255,.22)}
.chm-app-shell .chm-home .aaa-card:hover{transform:translateY(-2px)}
.chm-app-shell .chm-home>section:nth-of-type(2) .aaa-card{border-radius:18px!important;background:linear-gradient(180deg,rgba(20,27,36,.74),rgba(9,13,18,.9))!important}
.chm-app-shell .chm-home>section:last-child{padding-bottom:1rem}
@media (max-width:1024px){.chm-app-shell .chm-home>section:first-child{grid-template-columns:1fr}.chm-app-shell .chm-home>section:first-child>aside{min-height:auto}.chm-app-shell .chm-home>section:first-child>article>div:first-child{min-height:500px}.chm-app-shell .chm-home .chm-home-social .mx-auto{max-width:none}}
@media (max-width:640px){.chm-app-shell .chm-home{padding-top:.4rem!important}.chm-app-shell .chm-home>section{margin-top:.75rem}.chm-app-shell .chm-home>section:first-child>article>div:first-child{min-height:430px}.chm-app-shell .chm-home h1{font-size:clamp(3.4rem,18vw,5.8rem)!important}.chm-app-shell .chm-home .chm-home-social::before{margin-inline:4%}.chm-app-shell .chm-home .aaa-card:hover{transform:none}}
CSS

      - name: Verify
        run: |
          bun run build
          bun run typecheck
          bun run lint
          bun run test

      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/index.tsx src/chmel-design-system.css .github/workflows/masterpiece-ui.yml
          git commit -m 'feat(ui): transform homepage into premium sports masterpiece'
          git rm .github/workflows/masterpiece-ui.yml
          git commit -m 'chore: remove one-shot masterpiece workflow'
          git push origin HEAD:main
