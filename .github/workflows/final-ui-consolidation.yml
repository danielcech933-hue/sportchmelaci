name: Final UI consolidation

on:
  push:
    branches: [main]

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply final UI consolidation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2
      - run: bun install --no-frozen-lockfile

      - name: Consolidate navigation, social and profile UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def patch(path, fn):
              p = Path(path)
              s = p.read_text()
              n = fn(s)
              if n == s:
                  print(f'NO CHANGE {path}')
              else:
                  p.write_text(n)
                  print(f'PATCHED {path}')

          # 1) Navigation: remove the entire game/casino group from desktop and mobile.
          def nav(s):
              s = s.replace(', Beer, Layers, Dices, Spade, PackageOpen', '')
              s = re.sub(r'\nconst GAME_ITEMS: NavItem\[\] = \[[\s\S]*?\];\n', '\n', s, count=1)
              s = re.sub(r'\n  \{ label: "Hry", icon: Dices, items: GAME_ITEMS \},', '', s, count=1)
              s = s.replace('    ...GAME_ITEMS,\n', '')
              return s
          patch('src/components/FloatingNav.tsx', nav)

          # 2) Homepage: remove casino quick action, keeping betting and social routes.
          def home(s):
              s = s.replace(', Gamepad2', '')
              s = re.sub(r'\n\s*<RouteCard to="/slots" title="Casino"[^\n]*\n', '\n', s, count=1)
              return s
          patch('src/routes/index.tsx', home)

          # 3) Hard-hide the obsolete game surfaces by redirecting their routes to lobby.
          def games(s):
              s = s.replace('import { createFileRoute, Link, notFound, Navigate } from "@tanstack/react-router";', 'import { createFileRoute, Navigate } from "@tanstack/react-router";')
              start = s.find('function GameLobby()')
              if start >= 0:
                  rest = s.find('function PokerPage()', start)
                  if rest > start:
                      s = s[:start] + 'function GameLobby(){ return <Navigate to="/" replace />; }\n\n' + s[rest:]
              return s
          patch('src/routes/games.$game.tsx', games)

          patch('src/routes/games.case-opening.tsx', lambda s: re.sub(r'import \{ createFileRoute, Navigate \}.*?\n', 'import { createFileRoute, Navigate } from "@tanstack/react-router";\n', s, count=1).replace('import { CaseOpeningLobby } from "@/components/case-opening/CaseOpeningLobby";\n', '').replace('import { useAuth } from "@/lib/auth";\n', '').replace('  component: CaseOpeningGate,', '  component: () => <Navigate to="/" replace />,').replace('\nfunction CaseOpeningGate()[\s\S]*\Z','\n'))

          patch('src/routes/arcade.tsx', lambda s: re.sub(r'\Z', '', s) and 'import { createFileRoute, Navigate } from "@tanstack/react-router";\n\nexport const Route = createFileRoute("/arcade")({ component: () => <Navigate to="/" replace /> });\n')
          patch('src/routes/slots.tsx', lambda s: 'import { createFileRoute, Navigate } from "@tanstack/react-router";\n\nexport const Route = createFileRoute("/slots")({ component: () => <Navigate to="/" replace /> });\n')

          # 4) Profile: remove the duplicate Identity2 block from the profile route and add clear section navigation.
          def profile_route(s):
              s = s.replace('import { ProfileIdentity2 } from "@/components/ProfileIdentity2";\n', '')
              s = s.replace('{userId ? <ProfileIdentity2 userId={userId} /> : null}\n', '')
              marker = '      <div className="mx-auto max-w-6xl px-3 sm:px-4">\n'
              nav = '        <nav aria-label="Profilové sekce" className="sticky top-[3.7rem] z-20 mb-4 flex max-w-full gap-1.5 overflow-x-auto rounded-2xl border border-white/8 bg-background/85 p-1.5 backdrop-blur-xl [scrollbar-width:none]">\n          {[["#overview","Přehled"],["#achievements","Výsledky"],["#photos","Fotky"],["#social","Aktivita"],["#security","Bezpečnost"]].map(([href,label]) => <a key={href} href={href} className="shrink-0 rounded-xl px-3 py-2 font-mono text-[9px] font-black uppercase tracking-[.16em] text-muted-foreground transition hover:bg-primary/10 hover:text-primary">{label}</a>)}\n        </nav>\n'
              s = s.replace(marker, marker + nav, 1)
              s = s.replace('{userId ? <ProfileAchievements userId={userId} /> : null}', '{userId ? <section id="achievements" className="scroll-mt-24"><ProfileAchievements userId={userId} /></section> : null}')
              s = s.replace('{userId ? <ProfileMediaGallery userId={userId} /> : null}', '{userId ? <section id="photos" className="scroll-mt-24"><ProfileMediaGallery userId={userId} /></section> : null}')
              s = s.replace('{userId ? <div className="mt-5"><SocialHub profileUserId={userId} /></div> : null}', '{userId ? <section id="social" className="mt-5 scroll-mt-24"><SocialHub profileUserId={userId} /></section> : null}')
              s = s.replace('<AccountSecurity />', '<section id="security" className="mt-5 scroll-mt-24"><AccountSecurity /></section>')
              return s
          patch('src/routes/profile.index.tsx', profile_route)

          # 5) ProfileView: no more arcade toggle / slot-only wallet presentation.
          def profile_view(s):
              s = s.replace(', Gamepad2', '')
              s = s.replace('import { ArcadeProfile } from "@/components/ArcadeProfile";\n', '')
              s = s.replace('  const [mode, setMode] = useState<"real" | "arcade">("real");\n', '')
              s = s.replace('  const { openChat } = useDm(); const { userDollars, slotCZK } = useWallet();', '  const { openChat } = useDm(); const { userDollars } = useWallet();')
              s = re.sub(r'\n\s*\{isSelf && <section className="mt-4 grid grid-cols-2 gap-3 sm:max-w-xl">[\s\S]*?</section>\}', '', s, count=1)
              s = re.sub(r'\n\s*<section className="mt-5 flex justify-center">[\s\S]*?</section>', '', s, count=1)
              s = re.sub(r'\{mode === "arcade" && targetId \? <ArcadeProfile userId=\{targetId\} isSelf=\{isSelf\} /> : <>', '<>', s, count=1)
              # Remove the closing conditional fragment's extra brace.
              s = s.replace('    </>}\n  </main>;', '    </>\n  </main>;')
              return s
          patch('src/components/ProfileView.tsx', profile_view)

          # 6) SocialHub: stories should also appear on a player's profile, but only that player's stories.
          def social(s):
              s = s.replace('import { useEffect, useMemo, useState, type ChangeEvent, type ReactNode } from "react";', 'import { useEffect, useMemo, useState, type ChangeEvent, type ReactNode } from "react";\nimport { Link } from "@tanstack/react-router";')
              needle = '      let postQuery = db\n'
              insert = '      if (profileUserId) storyQuery.eq("user_id", profileUserId);\n\n'
              if insert not in s:
                  s = s.replace(needle, insert + needle, 1)
              old = '{!profileUserId && <StoriesStrip groups={storyGroups} meGroup={meStoryGroup} user={Boolean(user)} disabled={uploading} onPick={(group) => setStoryViewer({ stories: group.stories, index: 0 })} onAdd={publishStory} />}\n'
              new = '<StoriesStrip groups={storyGroups} meGroup={profileUserId ? undefined : meStoryGroup} user={Boolean(user) && !profileUserId} disabled={uploading} onPick={(group) => setStoryViewer({ stories: group.stories, index: 0 })} onAdd={publishStory} />\n'
              s = s.replace(old, new, 1)
              # Make post authors clickable to their profile.
              s = s.replace('<div className="truncate text-sm font-bold text-white">{post.author_nickname}</div>', '<Link to="/profile/$id" params={{ id: post.user_id }} className="truncate text-sm font-bold text-white hover:text-amber-200">{post.author_nickname}</Link>')
              # In profile mode, only show the story strip when there is content.
              s = s.replace('<StoriesStrip groups={storyGroups}', '<StoriesStrip groups={storyGroups}')
              return s
          patch('src/components/SocialHub.tsx', social)

          # 7) Community roster: make players directly open profiles and remove generic game icon language.
          def community(s):
              s = s.replace('import { Crown, Flame, Gamepad2, Medal, Radio, Search, Shield, Sparkles, Trophy, Users, Zap }', 'import { Crown, Flame, Medal, Radio, Search, Shield, Sparkles, Trophy, Users, Zap }')
              s = s.replace('<Gamepad2 className="h-4 w-4 text-amber-200" />', '<Trophy className="h-4 w-4 text-amber-200" />')
              s = s.replace('<Gamepad2 className="h-4 w-4" /> MATCHMAKER', '<Swords className="h-4 w-4" /> MATCHMAKER')
              s = s.replace('<Gamepad2 className="h-5 w-5" />', '<Trophy className="h-5 w-5" />')
              if 'import { Crown, Flame, Medal, Radio, Search, Shield, Sparkles, Trophy, Users, Zap, Swords }' not in s:
                  s = s.replace('import { Crown, Flame, Medal, Radio, Search, Shield, Sparkles, Trophy, Users, Zap }', 'import { Crown, Flame, Medal, Radio, Search, Shield, Sparkles, Trophy, Users, Zap, Swords }')
              pattern = r'<div className="group relative overflow-hidden rounded-2xl border border-white/8 bg-white/\[\.02\] p-4 transition hover:-translate-y-1 hover:border-amber-300/25">'
              s = re.sub(pattern, '<Link to="/profile/$id" params={{ id: player.key }} className="group relative block overflow-hidden rounded-2xl border border-white/8 bg-white/[.02] p-4 transition hover:-translate-y-1 hover:border-amber-300/25">', s, count=1)
              s = s.replace('</div>;\n}\nfunction Signal', '</Link>;\n}\nfunction Signal', 1)
              return s
          patch('src/routes/community.tsx', community)
          PY

      - name: Fix known game-hide build issue and verify
        shell: bash
        run: |
          # The previous one-shot hide workflow once malformed index.tsx; make sure homepage remains syntactically valid.
          bun run build
          bun run typecheck
          bun run lint
          bun run test

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/FloatingNav.tsx src/routes/index.tsx 'src/routes/games.$game.tsx' src/routes/games.case-opening.tsx src/routes/arcade.tsx src/routes/slots.tsx src/routes/profile.index.tsx src/components/ProfileView.tsx src/components/SocialHub.tsx src/routes/community.tsx
          git add .github/workflows/final-ui-consolidation.yml
          git commit -m 'Apply final UI consolidation'
          git push
