name: repair-dm-window

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repair DM load window
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/lib/dm.tsx')
          text = p.read_text(encoding='utf-8')

          old = '''  const load = useCallback(async () => {
    if (!user) {
      setMessages([]);
      return;
    }
    const { data } = await supabase
      .from("direct_messages")
      .select("id,sender_id,recipient_id,content,read_at,created_at")
      .order("created_at", { ascending: true })
      .limit(500);
    setMessages(((data ?? []) as Row[]).map(toDm));
  }, [user]);'''

          new = '''  const load = useCallback(async () => {
    if (!user) {
      setMessages([]);
      return;
    }

    const { data, error } = await supabase
      .from("direct_messages")
      .select("id,sender_id,recipient_id,content,read_at,created_at")
      .or(`sender_id.eq.${user.id},recipient_id.eq.${user.id}`)
      .order("created_at", { ascending: false })
      .limit(500);

    if (error) return;

    const rows = ((data ?? []) as Row[]).reverse();
    if (rows.length === 0) {
      setMessages([]);
      return;
    }

    setMessages((prev) => {
      const merged = new Map(prev.map((m) => [m.id, m]));
      for (const row of rows) merged.set(row.id, toDm(row));
      return [...merged.values()].sort((a, b) => {
        if (a.createdAt === b.createdAt) return a.id.localeCompare(b.id);
        return a.createdAt < b.createdAt ? -1 : 1;
      });
    });
  }, [user]);'''

          if old not in text:
              raise SystemExit('expected old DM load block not found; refusing unsafe patch')

          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm -f .github/workflows/repair-dm-window.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/dm.tsx .github/workflows/repair-dm-window.yml
          git commit -m "fix(chat): keep newest DM window and merge state"
          git push origin HEAD:main
