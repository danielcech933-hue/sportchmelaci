name: chat-resilience-patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch chat resilience
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          dm = Path('src/lib/dm.tsx')
          text = dm.read_text(encoding='utf-8')
          if 'const onVisibility = () => { if (document.visibilityState === "visible") void load(); };' not in text:
              text = text.replace('const iv = setInterval(load, 15000);', 'const iv = setInterval(load, 3000);', 1)
              old = '    const onFocus = () => load();\n    window.addEventListener("focus", onFocus);'
              new = '    const onFocus = () => load();\n    const onOnline = () => load();\n    const onVisibility = () => { if (document.visibilityState === "visible") void load(); };\n    window.addEventListener("focus", onFocus);\n    window.addEventListener("online", onOnline);\n    document.addEventListener("visibilitychange", onVisibility);'
              if old not in text: raise SystemExit('DM focus block not found')
              text = text.replace(old, new, 1)
              old_cleanup = '      window.removeEventListener("focus", onFocus);'
              new_cleanup = '      window.removeEventListener("focus", onFocus);\n      window.removeEventListener("online", onOnline);\n      document.removeEventListener("visibilitychange", onVisibility);'
              if old_cleanup not in text: raise SystemExit('DM cleanup block not found')
              text = text.replace(old_cleanup, new_cleanup, 1)
              dm.write_text(text, encoding='utf-8')

          chat = Path('src/routes/chat.tsx')
          text = chat.read_text(encoding='utf-8')
          if 'const refreshMessages = useCallback' not in text:
              marker = '  const loadAvatarsFor = useCallback(async (ids: string[]) => {'
              start = text.find(marker)
              if start < 0: raise SystemExit('Chat avatar callback not found')
              end = text.find('  }, []);', start)
              if end < 0: raise SystemExit('Chat avatar callback end not found')
              end += len('  }, []);')
              helper = '''\n\n  const refreshMessages = useCallback(async () => {\n    const { data, error } = await supabase\n      .from("chat_messages")\n      .select("*")\n      .order("created_at", { ascending: true })\n      .limit(200);\n    if (error) { setError(error.message); return; }\n    const rows = (data ?? []) as ChatRow[];\n    setMessages(rows);\n    void loadAvatarsFor(Array.from(new Set(rows.map((r) => r.user_id))));\n  }, [loadAvatarsFor]);'''
              text = text[:end] + helper + text[end:]

              old_initial = '''    supabase\n      .from("chat_messages")\n      .select("*")\n      .order("created_at", { ascending: true })\n      .limit(200)\n      .then(({ data, error }) => {\n        if (cancelled) return;\n        if (error) { setError(error.message); return; }\n        const rows = (data ?? []) as ChatRow[];\n        setMessages(rows);\n        loadAvatarsFor(Array.from(new Set(rows.map((r) => r.user_id))));\n      });\n\n'''
              if old_initial not in text: raise SystemExit('Chat initial load block not found')
              text = text.replace(old_initial, '    void refreshMessages();\n\n', 1)

              old_sub = '      .subscribe();\n\n    return () => {\n      cancelled = true;\n      supabase.removeChannel(channel);\n    };'
              new_sub = '''      .subscribe((status) => {\n        if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") void refreshMessages();\n      });\n\n    const poll = window.setInterval(() => void refreshMessages(), 3000);\n    const onOnline = () => void refreshMessages();\n    const onVisibility = () => { if (document.visibilityState === "visible") void refreshMessages(); };\n    window.addEventListener("online", onOnline);\n    document.addEventListener("visibilitychange", onVisibility);\n\n    return () => {\n      cancelled = true;\n      window.clearInterval(poll);\n      window.removeEventListener("online", onOnline);\n      document.removeEventListener("visibilitychange", onVisibility);\n      supabase.removeChannel(channel);\n    };'''
              if old_sub not in text: raise SystemExit('Chat subscription block not found')
              text = text.replace(old_sub, new_sub, 1)
              text = text.replace('    setInput("");\n    inputRef.current?.focus();', '    setInput("");\n    void refreshMessages();\n    inputRef.current?.focus();', 1)
              text = text.replace('  }, [loadAvatarsFor]);', '  }, [loadAvatarsFor, refreshMessages]);', 1)
              chat.write_text(text, encoding='utf-8')

          # Verify the critical fallbacks exist before committing.
          dm_text = dm.read_text(encoding='utf-8')
          chat_text = chat.read_text(encoding='utf-8')
          assert 'setInterval(load, 3000)' in dm_text
          assert 'setInterval(() => void refreshMessages(), 3000)' in chat_text
          assert 'const refreshMessages = useCallback' in chat_text
          print('chat resilience patch verified')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/dm.tsx src/routes/chat.tsx .github/workflows/chat-resilience-patch.yml
          if git diff --cached --quiet; then
            echo "No changes needed; removing one-time workflow."
            git rm -f .github/workflows/chat-resilience-patch.yml
          fi
          git add -A
          git commit -m "fix(chat): add resilient realtime fallback" || true
          git push origin HEAD:main
