name: chat-resilience-patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch chat resilience
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          dm = Path('src/lib/dm.tsx')
          text = dm.read_text(encoding='utf-8')
          text = text.replace('const iv = setInterval(load, 15000);', 'const iv = setInterval(load, 3000);', 1)
          text = text.replace(
              '    const onFocus = () => load();\n    window.addEventListener("focus", onFocus);',
              '    const onFocus = () => load();\n    const onOnline = () => load();\n    const onVisibility = () => { if (document.visibilityState === "visible") void load(); };\n    window.addEventListener("focus", onFocus);\n    window.addEventListener("online", onOnline);\n    document.addEventListener("visibilitychange", onVisibility);',
              1,
          )
          text = text.replace(
              '      window.removeEventListener("focus", onFocus);',
              '      window.removeEventListener("focus", onFocus);\n      window.removeEventListener("online", onOnline);\n      document.removeEventListener("visibilitychange", onVisibility);',
              1,
          )
          dm.write_text(text, encoding='utf-8')

          chat = Path('src/routes/chat.tsx')
          text = chat.read_text(encoding='utf-8')
          text = text.replace(
              '        loadAvatarsFor(Array.from(new Set(rows.map((r) => r.user_id))));\n      });',
              '        loadAvatarsFor(Array.from(new Set(rows.map((r) => r.user_id))));\n      });',
              1,
          )
          text = text.replace(
              '      .subscribe();\n\n    return () => {',
              '      .subscribe((status) => {\n        if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") void refresh();\n      });\n\n    const poll = window.setInterval(() => void refresh(), 3000);\n    const onOnline = () => void refresh();\n    const onVisibility = () => { if (document.visibilityState === "visible") void refresh(); };\n    window.addEventListener("online", onOnline);\n    document.addEventListener("visibilitychange", onVisibility);\n\n    return () => {\n      window.clearInterval(poll);\n      window.removeEventListener("online", onOnline);\n      document.removeEventListener("visibilitychange", onVisibility);',
              1,
          )
          text = text.replace(
              '  }, [loadAvatarsFor]);',
              '  }, [loadAvatarsFor]);\n',
              1,
          )
          # Add a dedicated refresh helper inside ChatPage and use it for polling.
          marker = '  const loadAvatarsFor = useCallback(async (ids: string[]) => {'
          if marker not in text:
              raise SystemExit('chat marker not found')
          insert_after = '  }, []);\n\n'
          pos = text.find(insert_after, text.find(marker))
          if pos == -1:
              raise SystemExit('chat avatar callback end not found')
          pos += len(insert_after)
          helper = '  const refresh = useCallback(async () => {\n    const { data, error } = await supabase.from("chat_messages").select("*").order("created_at", { ascending: true }).limit(200);\n    if (error) { setError(error.message); return; }\n    const rows = (data ?? []) as ChatRow[];\n    setMessages(rows);\n    void loadAvatarsFor(Array.from(new Set(rows.map((r) => r.user_id))));\n  }, [loadAvatarsFor]);\n\n'
          text = text[:pos] + helper + text[pos:]
          # Reuse refresh for initial load to keep one source of truth.
          old_initial = '''    supabase\n      .from("chat_messages")\n      .select("*")\n      .order("created_at", { ascending: true })\n      .limit(200)\n      .then(({ data, error }) => {\n        if (cancelled) return;\n        if (error) { setError(error.message); return; }\n        const rows = (data ?? []) as ChatRow[];\n        setMessages(rows);\n        loadAvatarsFor(Array.from(new Set(rows.map((r) => r.user_id))));\n      });\n\n'''
          if old_initial in text:
              text = text.replace(old_initial, '    void refresh();\n\n', 1)
          else:
              raise SystemExit('chat initial load block not found')
          # Optimistic self-refresh after successful send.
          text = text.replace('    setInput("");\n    inputRef.current?.focus();', '    setInput("");\n    void refresh();\n    inputRef.current?.focus();', 1)
          # Update effect dependency to include refresh.
          text = text.replace('  }, [loadAvatarsFor]);', '  }, [loadAvatarsFor, refresh]);', 1)
          chat.write_text(text, encoding='utf-8')
          PY

          bun install --no-frozen-lockfile
          bun run build
          bun run typecheck
          bun run lint
          bun run test

          rm -f .github/workflows/chat-resilience-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/dm.tsx src/routes/chat.tsx .github/workflows/chat-resilience-patch.yml
          git commit -m "fix(chat): add realtime polling and reconnect fallback"
          git push origin HEAD:main
