name: one-shot-ui-polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply remaining UI polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text()
              original = text
              for old, new in replacements:
                  if isinstance(old, str):
                      if old not in text:
                          raise SystemExit(f"Pattern not found in {path}: {old[:120]!r}")
                      text = text.replace(old, new, 1)
                  else:
                      text, count = old.subn(new, text, count=1)
                      if count != 1:
                          raise SystemExit(f"Regex pattern not found in {path}")
              if text == original:
                  raise SystemExit(f"No change in {path}")
              p.write_text(text)

          patch('src/routes/schedule.tsx', [
              ('import { UltraArenaShell, UltraLinkButton, UltraMetric, UltraSection, LiveBadge, TimeBadge, PowerMark } from "@/components/UltraArenaShell";\n',
               'import { UltraArenaShell, UltraLinkButton, UltraMetric, UltraSection, LiveBadge, TimeBadge, PowerMark } from "@/components/UltraArenaShell";\nimport { StateBlock, SkeletonRows } from "@/components/ui-kit";\n'),
              ('  if (loading) return null;\n',
               '  if (loading) return <main className="mx-auto max-w-[1450px] px-3 py-8 sm:px-5 lg:px-7"><SkeletonRows rows={6} /></main>;\n'),
              ('<EmptyState />',
               '<StateBlock state="empty" title="Žádné naplánované zápasy" hint="Změň sport, formát nebo den a zkus to znovu." />'),
          ])

          patch('src/routes/tournaments.tsx', [
              ('import { NICKNAMES_DATALIST_ID, NicknamesDatalist, useNicknames } from "@/lib/nicknames";\n',
               'import { NICKNAMES_DATALIST_ID, NicknamesDatalist, useNicknames } from "@/lib/nicknames";\nimport { StateBlock, SkeletonRows } from "@/components/ui-kit";\n'),
              ('  if (loading) return null;\n',
               '  if (loading) return <main className="mx-auto max-w-5xl px-3 py-8 sm:px-4"><SkeletonRows rows={5} /></main>;\n'),
              (re.compile(r'\{list\.length === 0 \? \(\s*<p className="text-sm text-muted-foreground">[\s\S]*?</p>\s*\) : \('),
               '{list.length === 0 ? (\n          <StateBlock state="empty" title={user ? "Zatím žádné turnaje" : "Přihlas se pro zobrazení turnajů"} hint="Jakmile bude turnaj založený, zobrazí se tady." />\n        ) : ('),
          ])

          patch('src/routes/rankings.tsx', [
              ('import { playerEmoji, rankEmoji } from "@/lib/emoji";\n',
               'import { playerEmoji, rankEmoji } from "@/lib/emoji";\nimport { StateBlock } from "@/components/ui-kit";\n'),
              (re.compile(r'\{err && <div className="mt-3 rounded-xl border border-rose-300/20 bg-rose-300/5 p-3 text-xs text-rose-200">Ranking feed error: \{err\}</div>\}'),
               '{err && <div className="mt-3"><StateBlock state="error" title="Ranking feed se nepodařilo načíst" hint={err} /></div>}'),
              ('<EmptyState />', '<StateBlock state="empty" title="Zatím žádná data" hint="Po odehrání zápasů se pořadí objeví tady." />'),
          ])

          # Root navigation sanity: the desktop nav must remain mounted in the header.
          root = Path('src/routes/__root.tsx')
          root_text = root.read_text()
          if 'import { FloatingNav, DesktopNav } from "@/components/FloatingNav";' not in root_text:
              raise SystemExit('DesktopNav import missing from __root.tsx')
          if '<DesktopNav />' not in root_text:
              raise SystemExit('DesktopNav mount missing from __root.tsx')

          print('UI polish patches applied.')
          PY

      - name: Verify changes
        run: |
          bun install --no-frozen-lockfile
          bun run build
          bun run typecheck

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/schedule.tsx src/routes/tournaments.tsx src/routes/rankings.tsx .github/workflows/one-shot-ui-polish.yml
          git commit -m "Complete remaining UI state polish" || exit 0
          git rm .github/workflows/one-shot-ui-polish.yml
          git add -u
          git commit -m "Remove one-shot UI polish workflow"
          git push
