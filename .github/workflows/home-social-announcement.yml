name: Home social announcement

on:
  push:
    branches: [main]

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2
      - run: bun install --no-frozen-lockfile
      - name: Patch homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text()
          if 'function HomepageSocialAnnouncement()' not in s:
              s = s.replace('import { SportActionModal } from "@/components/SportActionModal";\n', 'import { SportActionModal } from "@/components/SportActionModal";\nimport { supabase } from "@/integrations/supabase/client";\n')
              anchor = '      <section className="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">'
              block = '''      <HomepageSocialAnnouncement />\n\n'''
              if '      <HomepageSocialAnnouncement />' not in s:
                  s = s.replace(anchor, block + anchor, 1)
              component = r'''\nfunction HomepageSocialAnnouncement() {\n  const [story, setStory] = useState<{ id: string; author_nickname: string; media_url: string; caption: string | null; created_at: string } | null>(null);\n  const [viewerOpen, setViewerOpen] = useState(false);\n  const [failed, setFailed] = useState(false);\n\n  useEffect(() => {\n    let cancelled = false;\n    const loadStory = async () => {\n      try {\n        const { data } = await (supabase as any).from("social_stories").select("id,author_nickname,media_url,caption,created_at").gt("expires_at", new Date().toISOString()).order("created_at", { ascending: false }).limit(1).maybeSingle();\n        if (!cancelled) {\n          setStory(data ?? null);\n          setFailed(false);\n        }\n      } catch {\n        if (!cancelled) setFailed(true);\n      }\n    };\n    void loadStory();\n    const timer = window.setInterval(loadStory, 30000);\n    return () => { cancelled = true; window.clearInterval(timer); };\n  }, []);\n\n  return <>\n    <section className="mt-5 overflow-hidden rounded-[26px] border border-amber-300/20 bg-[radial-gradient(circle_at_82%_28%,rgba(255,210,80,.16),transparent_28%),linear-gradient(135deg,rgba(255,210,80,.07),rgba(0,0,0,.35) 48%,rgba(37,211,238,.05))] p-4 shadow-[0_0_50px_rgba(255,206,64,.06)] sm:p-5">\n      <div className="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">\n        <div className="min-w-0 flex-1">\n          <div className="flex flex-wrap items-center gap-2">\n            <span className="aaa-chip border-amber-300/45 bg-amber-300/10 text-amber-100"><Sparkles className="h-3 w-3" /> NOVĚ NA CHMELOVÁCÍCH</span>\n            <span className="aaa-meta text-cyan-200/65">STORIES · FEED · MOMENTY</span>\n          </div>\n          <h2 className="mt-2 font-display text-2xl tracking-[.10em] text-white sm:text-3xl">STORIES & FEED JSOU TADY</h2>\n          <p className="mt-2 max-w-2xl text-sm leading-6 text-white/50">Sdílej momenty ze zápasů, přidávej 24h stories a piš příspěvky. Ostatní hráči je mohou lajkovat a komentovat.</p>\n          <Link to="/community" className="aaa-cta mt-4 inline-flex items-center gap-2 px-4 py-2.5 text-[9px] font-black uppercase tracking-[.16em]">Otevřít community <ArrowRight className="h-4 w-4" /></Link>\n        </div>\n        <div className="shrink-0 lg:w-[250px]">\n          {story && !failed ? (\n            <button type="button" onClick={() => setViewerOpen(true)} className="group relative block w-full overflow-hidden rounded-[22px] border border-cyan-200/20 bg-black text-left shadow-[0_0_30px_rgba(34,211,238,.06)]">\n              <div className="aspect-[4/5] overflow-hidden">\n                <img src={story.media_url} alt={story.caption || `Story uživatele ${story.author_nickname}`} className="h-full w-full object-cover transition duration-500 group-hover:scale-105" loading="lazy" />\n              </div>\n              <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/90 via-black/45 to-transparent px-4 pb-3 pt-12">\n                <div className="aaa-meta text-cyan-100/70">NEJNOVĚJŠÍ STORY · 24 H</div>\n                <div className="mt-1 truncate text-sm font-bold text-white">{story.author_nickname}</div>\n              </div>\n            </button>\n          ) : (\n            <div className="flex aspect-[4/5] flex-col items-center justify-center rounded-[22px] border border-dashed border-amber-200/20 bg-black/20 p-5 text-center">\n              <Sparkles className="h-8 w-8 text-amber-200/65" />\n              <div className="mt-3 font-display text-lg tracking-[.08em] text-white">PRVNÍ STORY ČEKÁ NA TEBE</div>\n              <div className="mt-2 text-xs leading-5 text-white/30">Přidej moment ze zápasu a ukaž ho ostatním.</div>\n              <Link to="/community" className="aaa-ghost mt-4 px-3 py-2 text-[8px] font-black uppercase tracking-[.15em]">Přidat story</Link>\n            </div>\n          )}\n        </div>\n      </div>\n    </section>\n\n    {viewerOpen && story && <div className="fixed inset-0 z-[95] grid place-items-center bg-black/92 p-3 backdrop-blur-sm" onClick={() => setViewerOpen(false)}>\n      <div className="relative flex h-[min(90vh,860px)] w-full max-w-md items-center justify-center overflow-hidden rounded-[28px] border border-white/10 bg-black" onClick={(event) => event.stopPropagation()}>\n        <img src={story.media_url} alt={story.caption || "Story"} className="h-full w-full object-contain" />\n        <div className="absolute inset-x-0 top-0 bg-gradient-to-b from-black/80 to-transparent p-4 pt-6">\n          <div className="text-sm font-bold text-white">{story.author_nickname}</div>\n          <div className="aaa-meta mt-1">24H · STORY ZE ZÁPASU</div>\n        </div>\n        <button type="button" onClick={() => setViewerOpen(false)} className="absolute right-3 top-3 grid h-10 w-10 place-items-center rounded-full bg-black/50 text-white" aria-label="Zavřít story"><span className="text-lg leading-none">×</span></button>\n      </div>\n    </div>}\n  </>;\n}\n'''
              s = s.replace('\nfunction SportGroup(', component + '\nfunction SportGroup(', 1)
              p.write_text(s)
          PY
      - name: Build and typecheck
        run: |
          bun run build
          bun run typecheck
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/index.tsx .github/workflows/home-social-announcement.yml
          git commit -m 'Add homepage social announcement'
          git rm .github/workflows/home-social-announcement.yml
          git commit -m 'Remove one-shot homepage social workflow'
          git push
