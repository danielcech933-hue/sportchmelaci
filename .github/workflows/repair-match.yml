name: repair-match-route

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'chore: repair match route search') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair optional match id
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/routes/match.tsx")
          text = path.read_text(encoding="utf-8")
          changed = False

          old = 'const searchSchema = z.object({ id: z.string() });'
          new = 'const searchSchema = z.object({ id: z.string().optional() });'
          if old in text:
              text = text.replace(old, new, 1)
              changed = True

          old_effect = '''  useEffect(() => {
    fetchMatch(id).then((m) => (m ? setMatch(m) : setNotFound(true))).catch((e) => setActionError(e instanceof Error ? e.message : "Zápas se nepodařilo načíst."));
    fetchAllMatches().then(setAllMatches).catch(() => setAllMatches([]));
  }, [id]);
  useMatchesRealtime(() => { if (!dirty.current) fetchMatch(id).then((m) => m && setMatch(m)).catch(() => undefined); }, { matchId: id });'''
          new_effect = '''  useEffect(() => {
    setNotFound(false);
    setActionError(null);
    fetchAllMatches().then(setAllMatches).catch(() => setAllMatches([]));
    if (!id) {
      setMatch(null);
      return;
    }
    fetchMatch(id)
      .then((m) => (m ? setMatch(m) : setNotFound(true)))
      .catch((e) => setActionError(e instanceof Error ? e.message : "Zápas se nepodařilo načíst."));
  }, [id]);
  useMatchesRealtime(
    () => {
      if (!id || dirty.current) return;
      fetchMatch(id).then((m) => m && setMatch(m)).catch(() => undefined);
    },
    { matchId: id, enabled: Boolean(id) },
  );'''
          if old_effect in text:
              text = text.replace(old_effect, new_effect, 1)
              changed = True

          marker = '  if (notFound) return <main'
          empty_state = '''  if (!id) return <main className="mx-auto max-w-6xl px-4 py-16 text-center"><div className="mx-auto grid h-16 w-16 place-items-center rounded-2xl border border-amber-300/20 bg-amber-300/5 text-amber-200"><Radio className="h-7 w-7" /></div><h1 className="mt-5 font-display text-4xl tracking-wider text-amber-100">MATCH CENTER</h1><p className="mt-2 text-white/40">Vyber konkrétní zápas z lobby, plánu nebo scoreboardu.</p><Link to="/" className="mt-6 inline-flex items-center gap-2 rounded-xl border border-amber-300/20 px-4 py-2 text-xs font-black uppercase tracking-[.18em] text-amber-200 hover:bg-amber-300/10"><ArrowLeft className="h-4 w-4" /> Lobby</Link></main>;
'''
          if marker in text and empty_state not in text:
              text = text.replace(marker, empty_state + marker, 1)
              changed = True

          if not changed:
              print("No repair needed")
              raise SystemExit(0)

          path.write_text(text, encoding="utf-8")
          print("Repaired", path)
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/match.tsx
          git diff --cached --quiet && exit 0
          git commit -m "chore: repair match route search"
          git push